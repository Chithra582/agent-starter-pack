name: rag-corpus-indexer
description: Connects to Cloud Storage or document stores to index, chunk, and benchmark retrieval corpora.
input_schema:
  type: object
  properties:
    corpus_source:
      type: string
      description: GCS URI or local path containing source documents for retrieval.
    chunk_size:
      type: integer
      description: Maximum token or character size per document chunk.
    embedding_model:
      type: string
      description: Vertex AI embedding model endpoint to compute vector representations.
    destination_index:
      type: string
      description: Target Vertex AI Search or vector store index ID.
  required:
    - corpus_source
    - destination_index
